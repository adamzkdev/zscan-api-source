[workspace]
resolver = "2"
members = ["crates/chain", "crates/db", "crates/indexer", "crates/api", "crates/verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zscan-chain = { path = "crates/chain" }
zscan-db = { path = "crates/db" }
zebra-chain = "13.0.1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "macros", "migrate", "json"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lru = "0.12"

[profile.release]
debug = false
